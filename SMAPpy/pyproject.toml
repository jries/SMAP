[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smappy"
version = "0.1.0dev"
description = "Single-molecule localization fitting pipeline (Python port of the SMAP fast-simple workflow)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "tifffile>=2022.5", "h5py>=3.6"]

[project.optional-dependencies]
viewer = ["matplotlib>=3.4"]   # RangeSlider

[tool.setuptools.packages.find]
where = ["src"]
