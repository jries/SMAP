[build-system]
requires    = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name              = "py-comet"
dynamic           = ["version"]
description       = "GPU-accelerated drift correction for single molecule localization microscopy datasets"
readme            = "README.md"
license = { text = "MIT" }
# Python 3.6/3.7 users are served by the frozen 1.0.x release line, which pip
# resolves to automatically; see the legacy note in the README.
requires-python   = ">=3.9"
authors           = [
  { name = "Lenny Reinkensmeier", email = "lenny.reinkensmeier@ifnano.de" },
  { name = "Mark Bates", email = "mark.bates@ifnano.de" }
]
keywords = [
  "SMLM", "super-resolution", "microscopy", "drift-correction",
  "localization-microscopy", "STORM", "PALM", "MINFLUX", "CUDA", "GPU",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Physics",
]
# Floors only: pip already refuses releases that do not support the running
# interpreter, so per-version caps just create resolver conflicts in user
# environments. Verified against numpy 2.5 / scipy 1.18 / pandas 3.0 /
# matplotlib 3.11 on Python 3.12, and numpy 1.26 / scipy 1.13 on Python 3.9.
dependencies = [
  "numpy>=1.20",
  "scipy>=1.6",
  "numba>=0.53",
  "pandas>=1.2",
  "matplotlib>=3.3",
  "h5py>=3.1",
]

[project.optional-dependencies]
# PyTorch backend: works on CUDA, Apple MPS, and plain CPU.
torch = ["torch>=1.12"]
test  = ["pytest>=6.0"]
docs  = ["mkdocs>=1.4", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.20", "pymdown-extensions>=9.0"]
dev   = ["py-comet[torch,test,docs]", "build>=0.10", "twine>=4.0", "vermin>=1.5"]

[project.urls]
Homepage      = "https://comet.smlm.tools/"
Documentation = "https://comet.smlm.tools/"
Repository    = "https://github.com/gpufit/Comet"
Issues        = "https://github.com/gpufit/Comet/issues"

[project.scripts]
comet = "comet.cli.cli_interface:main"
comet_self_test = "comet.tests.self_test:main"

[tool.setuptools.dynamic]
version = { attr = "comet._version.__version__" }

[tool.setuptools.packages.find]
where   = ["."]
# comet.tests ships deliberately: CI cannot exercise the CUDA backend, so users
# with a GPU need `pytest --pyargs comet.tests` to validate it on their own
# hardware, and `comet_self_test` lives there too.
include = ["comet*"]

[tool.pytest.ini_options]
testpaths = ["comet/tests"]
addopts = "-ra"
markers = [
  "cuda: needs an NVIDIA GPU and a working CUDA driver",
  "torch: needs the optional torch dependency",
  "slow: takes more than a few seconds",
]
