name: release

# Publishes to PyPI via Trusted Publishing (OIDC) -- no API token in secrets.
#
# One-time setup at https://pypi.org/manage/account/publishing/ :
#   PyPI project name : py-comet
#   Owner             : gpufit
#   Repository        : Comet
#   Workflow          : release.yml
#   Environment       : pypi        (and `testpypi` for the TestPyPI publisher)
#
# Release flow:
#   1. Run this workflow manually with target=testpypi and confirm the install.
#   2. Tag the commit (v1.1.0 on master, v1.0.2 on maint/1.0.x) and push;
#      the tag push publishes to PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

defaults:
  run:
    working-directory: Python_interface

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Check metadata
        run: twine check dist/*

      - name: Confirm the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('comet/_version.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match comet/_version.py ($version)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: Python_interface/dist/

  # Install the built wheel on a clean machine, exactly as a user would.
  smoke-test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the wheel
        shell: bash
        run: pip install dist/*.whl
        working-directory: .

      - name: Import, self-test and CLI
        shell: bash
        run: |
          python -c "import comet; print(comet.__version__)"
          comet_self_test
          comet --help
        working-directory: .

  publish-testpypi:
    needs: smoke-test
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
