name: tests

on:
  push:
    branches: [master, "maint/**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: Python_interface

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Show detected backends
        run: python -c "import comet; print(comet.__version__); print('\n'.join(comet.describe_backends()))"

      - name: Run tests
        run: pytest -q

      - name: Post-install self-test
        run: comet_self_test

  # 3.6/3.7 are not a supported configuration and are deliberately NOT
  # executed in CI: the maint/1.0.x lane exists so pip resolves those
  # interpreters to 1.0.x instead of refusing the install -- a metadata
  # promise (requires-python), guarded by the syntax gate below and the
  # packaging tests, not by running the suite on museum interpreters whose
  # scientific stack no longer builds on current runners.
  compat-3-6-syntax:
    name: 3.6 syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install vermin

      # Only the package source is gated; the test suite may use newer syntax.
      - name: Check package source is still 3.6-compatible
        run: vermin --backport dataclasses --eval-annotations --no-parse-comments -t=3.6 --violations --exclude-regex '.*/tests/.*' comet/

  tkinter-free:
    name: import without tkinter
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      # Slim images have started shipping tkinter, so the absence this job
      # exists to test must be manufactured, not assumed.
      - name: Remove tkinter from the image
        run: |
          python - <<'EOF'
          import importlib.util, pathlib, shutil
          spec = importlib.util.find_spec("tkinter")
          if spec is None:
              print("tkinter already absent")
          else:
              pkg = pathlib.Path(spec.origin).parent
              shutil.rmtree(pkg)
              removed = [str(pkg)]
              for so in (pkg.parent / "lib-dynload").glob("_tkinter*"):
                  so.unlink()
                  removed.append(str(so))
              print("removed:", *removed)
          EOF

      - name: Confirm tkinter really is absent
        run: python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('tkinter') is None else 'tkinter present, this job proves nothing')"

      - run: pip install -e .

      - name: Import the package
        run: python -c "import comet; from comet.core import io_utils, drift_optimizer; print('ok', comet.__version__)"

      - name: Self-test still runs
        run: comet_self_test --mode cpu
